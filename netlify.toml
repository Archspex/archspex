[build]
  command = "node build-seo.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false

[build.processing.images]
  compress = false

# Always revalidate HTML so per-route SEO tag changes propagate immediately
# on new deploys. JS gets a 1-hour cache with revalidation.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
